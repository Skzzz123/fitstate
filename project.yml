name: FitState
options:
  bundleIdPrefix: com.god
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.35.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    DEVELOPMENT_LANGUAGE: "zh-Hans"
    # App Group 前缀必须带你的 Team ID，在 CI 里用 APP_GROUP_ID 覆盖：
    #   group.<你的TeamID>.com.god.fitstate
    APP_GROUP_ID: "group.com.god.fitstate"
    # 运行时真正去查容器的 App Group ID。与 APP_GROUP_ID 分开：
    # 签名工具会把工程里声明的组按「group.<TeamID> + 后缀」重新注册，
    # 所以运行时要用带 Team ID 的完整值。
    APP_GROUP_RUNTIME_ID: "group.com.god.fitstate"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_BITCODE: "NO"

targets:
  FitState:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - "**/.DS_Store"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: FitState
        PRODUCT_BUNDLE_IDENTIFIER: com.god.fitstate
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/FitState.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    dependencies:
      - target: FitStateWidget
        embed: true
        codeSign: false
    scheme:
      gatherCoverageData: false

  FitStateWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
        excludes:
          - "**/.DS_Store"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: FitStateWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.god.fitstate.widget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/FitStateWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
