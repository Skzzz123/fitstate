name: Toolchain Check

# 单独一个轻量流水线，用来验证「门户直开能力」这条免费路线所依赖的
# Ruby / spaceship 工具链在 GitHub Actions 上是好的。
# 不需要任何密钥，随时可以手动触发。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Scripts/apple-portal.rb'
      - 'Scripts/sign-ipa.sh'
      - '.github/workflows/toolchain-check.yml'

jobs:
  check:
    name: Check ruby + spaceship
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install spaceship
        run: |
          set -euo pipefail
          gem install fastlane --no-document
          ruby -e "require 'spaceship'; puts 'SPACESHIP_OK ' + (defined?(Spaceship::VERSION) ? Spaceship::VERSION.to_s : 'loaded')"

      - name: Syntax check
        run: |
          set -euo pipefail
          ruby -c Scripts/apple-portal.rb
          bash -n Scripts/sign-ipa.sh
          echo "SYNTAX_OK"

      - name: Verify spaceship can talk to the portal API surface
        run: |
          set -euo pipefail
          ruby -e '
            require "spaceship"
            # 只做类检查，不联网：确认我们要用的这些接口在当前 spaceship 版本里都存在
            checks = {
              "App.find" => Spaceship::Portal::App.respond_to?(:find),
              "App.create!" => Spaceship::Portal::App.respond_to?(:create!),
              "App#update_service" => Spaceship::Portal::App.instance_methods.include?(:update_service),
              "AppGroup.find" => Spaceship::Portal::AppGroup.respond_to?(:find),
              "AppGroup.create!" => Spaceship::Portal::AppGroup.respond_to?(:create!),
              "Device.find_by_udid" => Spaceship::Portal::Device.respond_to?(:find_by_udid),
              "Device.create!" => Spaceship::Portal::Device.respond_to?(:create!),
              "Certificate.create!" => Spaceship::Portal::Certificate.respond_to?(:create!),
              "CSR" => Spaceship::Portal::Certificate.respond_to?(:create_certificate_signing_request),
              "ProvisioningProfile.create!" => Spaceship::Portal::ProvisioningProfile.respond_to?(:create!),
              "HealthKit service" => !Spaceship::Portal::AppService::HealthKit.nil?,
              "AppGroup service" => !Spaceship::Portal::AppService::AppGroup.nil?
            }
            bad = checks.reject { |_, ok| ok }.keys
            if bad.empty?
              puts "API_SURFACE_OK"
            else
              puts "API_SURFACE_MISSING: " + bad.join(", ")
              exit 1
            end
          '

  # ---------------------------------------------------------------------------
  # 签名流水线自检：用假证书 + 假描述文件跑一遍 sign-ipa.sh，
  # 把「解描述文件 → 提取 entitlements → 导入钥匙串 → codesign → 校验」
  # 这套机械流程在没有 Apple 账号时也先验证一遍。
  # ---------------------------------------------------------------------------
  sign-self-test:
    name: Signing pipeline self-test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE="$(ls /Applications | grep -E '^Xcode.*\.app$' | sort -V | tail -1)"
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project FitState.xcodeproj \
            -scheme FitState \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            APP_GROUP_ID="group.97792VH57A.com.god.fitstate" \
            APP_GROUP_RUNTIME_ID="group.97792VH57A.com.god.fitstate" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build > build-unsigned.log 2>&1 || { tail -40 build-unsigned.log; exit 1; }
          tail -3 build-unsigned.log

      - name: Make fake signing material
        run: bash Scripts/make-fake-signing-material.sh build/portal

      - name: Run sign-ipa.sh
        run: |
          set -euo pipefail
          bash Scripts/sign-ipa.sh 2>&1 | tee build/sign.log
          if ! grep -q "SIGN_OK" build/sign.log; then
            echo "::error::签名流水线自测失败"
            exit 1
          fi

      - name: Verify result
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/FitState.app"
          codesign -d --entitlements :- "$APP" > build/final-entitlements.plist || true
          cat build/final-entitlements.plist
          grep -q "com.apple.developer.healthkit" build/final-entitlements.plist
          grep -q "com.apple.security.application-groups" build/final-entitlements.plist
          echo "### App bundle id:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          echo "### Widget bundle id:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/PlugIns/FitStateWidget.appex/Info.plist"
          echo "SIGN_PIPELINE_OK"
