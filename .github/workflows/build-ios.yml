name: Build iOS App

# 手动触发即可产出一个 .ipa，下载到 Windows 后用 Sideloadly 签名安装。
on:
  workflow_dispatch:
    inputs:
      app_group_id:
        description: 'App Group ID（签名时向 Apple 声明的组，形如 group.com.god.fitstate）'
        required: false
        default: 'group.com.god.fitstate'
      app_group_runtime_id:
        description: '运行时使用的 App Group ID（形如 group.<你的TeamID>.com.god.fitstate）'
        required: false
        default: 'group.com.god.fitstate'
      team_id:
        description: '你的 Team ID（10 位大写字母数字，免费个人团队从签名工具改写后的 bundle id 末段取）'
        required: false
        default: '97792VH57A'
      final_bundle_id:
        description: '签名工具最终装到手机上的 bundle id（开了自动 bundle id 时是 <原 id>.<TeamID>）'
        required: false
        default: 'com.god.fitstate.97792VH57A'
      device_udid:
        description: '要装进去的设备 UDID（写进描述文件的 ProvisionedDevices）'
        required: false
        default: '00008140-00166C2636D2801C'
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    name: Build .ipa
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE="$(ls /Applications | grep -E '^Xcode.*\.app$' | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Build
        env:
          APP_GROUP_ID: ${{ inputs.app_group_id || vars.APP_GROUP_ID || 'group.com.god.fitstate' }}
          APP_GROUP_RUNTIME_ID: ${{ inputs.app_group_runtime_id || vars.APP_GROUP_RUNTIME_ID || 'group.com.god.fitstate' }}
        run: |
          set -euo pipefail
          export APP_GROUP_ID
          export APP_GROUP_RUNTIME_ID
          echo "APP_GROUP_ID=$APP_GROUP_ID"
          echo "APP_GROUP_RUNTIME_ID=$APP_GROUP_RUNTIME_ID"

          # 未签名构建。Xcode 26+ 禁止用 ad-hoc 身份签 iOS 设备包
          # （Ad Hoc code signing is not allowed with SDK 'iOS 26.2'），
          # 所以这里先出无签名产物，再在下一步用 codesign 手动盖 ad-hoc 签名。
          set +e
          xcodebuild \
            -project FitState.xcodeproj \
            -scheme FitState \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            APP_GROUP_ID="$APP_GROUP_ID" \
            APP_GROUP_RUNTIME_ID="$APP_GROUP_RUNTIME_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build > build-unsigned.log 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "### 构建失败，日志尾部："
            tail -60 build-unsigned.log || true
            echo "::error::xcodebuild 失败"
            exit 1
          fi
          tail -5 build-unsigned.log || true

          # 校验 Info.plist 里的运行时 App Group ID 真的被展开了
          APP_PATH="build/Build/Products/Release-iphoneos/FitState.app"
          RUNTIME_ID=$(/usr/libexec/PlistBuddy -c "Print :AppGroupIdentifier" "$APP_PATH/Info.plist")
          echo "### 运行时 App Group ID = $RUNTIME_ID"
          if [ -z "$RUNTIME_ID" ] || [[ "$RUNTIME_ID" == *'$('* ]]; then
            echo "::error::Info.plist 的 AppGroupIdentifier 没有被正确展开：$RUNTIME_ID"
            exit 1
          fi

      - name: Verify and ad-hoc sign
        env:
          APP_GROUP_ID: ${{ inputs.app_group_id || vars.APP_GROUP_ID || 'group.com.god.fitstate' }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/FitState.app"

          # 关键校验：必须有真实二进制，否则打出来的是空壳 ipa
          if [ ! -f "$APP_PATH/FitState" ]; then
            echo "::error::主程序二进制 FitState 缺失"
            exit 1
          fi
          if [ ! -d "$APP_PATH/PlugIns/FitStateWidget.appex" ]; then
            echo "::error::小组件扩展 PlugIns/FitStateWidget.appex 缺失"
            exit 1
          fi
          if [ ! -f "$APP_PATH/PlugIns/FitStateWidget.appex/FitStateWidget" ]; then
            echo "::error::小组件二进制 FitStateWidget 缺失"
            exit 1
          fi
          echo "### 产物大小："
          du -sh "$APP_PATH"

          # 把 $(APP_GROUP_ID) 展开成实际值，写进临时 entitlements
          mkdir -p build/ent
          sed 's|$(APP_GROUP_ID)|'"$APP_GROUP_ID"'|g' Sources/App/FitState.entitlements > build/ent/app.plist
          sed 's|$(APP_GROUP_ID)|'"$APP_GROUP_ID"'|g' Sources/Widget/FitStateWidget.entitlements > build/ent/widget.plist

          # 先签内层扩展，再签外层 App
          codesign --force --sign - --entitlements build/ent/widget.plist \
            "$APP_PATH/PlugIns/FitStateWidget.appex"
          codesign --force --sign - --entitlements build/ent/app.plist \
            "$APP_PATH"

          echo "### 嵌入的 entitlements："
          codesign -d --entitlements :- "$APP_PATH" || true

      - name: Embed provisioning profile hint
        env:
          TEAM_ID: ${{ inputs.team_id || vars.TEAM_ID || '97792VH57A' }}
          APP_GROUP_RUNTIME_ID: ${{ inputs.app_group_runtime_id || vars.APP_GROUP_RUNTIME_ID || 'group.com.god.fitstate' }}
          FINAL_BUNDLE_ID: ${{ inputs.final_bundle_id || vars.FINAL_BUNDLE_ID || 'com.god.fitstate.97792VH57A' }}
          DEVICE_UDID: ${{ inputs.device_udid || vars.DEVICE_UDID || '00008140-00166C2636D2801C' }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/FitState.app"
          mkdir -p build/profile

          # Sideloadly 这类签名工具是靠 ipa 里的 embedded.mobileprovision 来判断
          # 这个 app 需要哪些 capability（HealthKit / App Groups…），再去门户申请。
          # 没有这个文件，它只会建一个裸 App ID，签出来的包就没有 HealthKit 权限，
          # 装到手机上会直接报 "Missing com.apple.developer.healthkit entitlement"。
          #
          # 这里自己造一份描述文件，要点：
          #   1. 外层用 CMS 封装（签名工具用 PKCS#7 解析）
          #   2. application-identifier 必须等于签名工具最终用的 bundle id
          #   3. ProvisionedDevices 要包含目标设备 UDID
          #   4. DeveloperCertificates 不能为空
          #   5. CreationDate / ExpirationDate 要成对
          openssl req -x509 -newkey rsa:2048 -keyout build/profile/key.pem -out build/profile/cert.pem \
            -days 3650 -nodes -subj "/CN=FitState Profile" >/dev/null 2>&1
          CERT_DER_B64=$(openssl x509 -in build/profile/cert.pem -outform DER | base64 | tr -d '\n')
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EXP=$(date -u -v+7d +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)
          UUID_VAL=$(uuidgen | tr '[:upper:]' '[:lower:]')

          cat > build/profile/profile.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>AppIDName</key><string>FitState</string>
            <key>ApplicationIdentifierPrefix</key>
            <array><string>${TEAM_ID}</string></array>
            <key>CreationDate</key><date>${NOW}</date>
            <key>Platform</key>
            <array><string>iOS</string></array>
            <key>DeveloperCertificates</key>
            <array>
              <data>${CERT_DER_B64}</data>
            </array>
            <key>Entitlements</key>
            <dict>
              <key>application-identifier</key><string>${TEAM_ID}.${FINAL_BUNDLE_ID}</string>
              <key>com.apple.developer.team-identifier</key>
              <array><string>${TEAM_ID}</string></array>
              <key>get-task-allow</key><true/>
              <key>keychain-access-groups</key>
              <array><string>${TEAM_ID}.${FINAL_BUNDLE_ID}</string></array>
              <key>com.apple.developer.healthkit</key><true/>
              <key>com.apple.developer.healthkit.access</key><array/>
              <key>com.apple.security.application-groups</key>
              <array><string>${APP_GROUP_RUNTIME_ID}</string></array>
            </dict>
            <key>ExpirationDate</key><date>${EXP}</date>
            <key>IsXcodeManaged</key><false/>
            <key>Name</key><string>FitState</string>
            <key>ProvisionedDevices</key>
            <array><string>${DEVICE_UDID}</string></array>
            <key>ProvisionsAllDevices</key><false/>
            <key>TeamIdentifier</key>
            <array><string>${TEAM_ID}</string></array>
            <key>TeamName</key><string>FitState</string>
            <key>TimeToLive</key><integer>7</integer>
            <key>UUID</key><string>${UUID_VAL}</string>
            <key>Version</key><integer>1</integer>
          </dict>
          </plist>
          PLIST

          # 自签一份 CMS 外壳，让签名工具能按 mobileprovision 的方式解析
          openssl smime -sign -in build/profile/profile.plist -outform DER -nodetach -binary \
            -signer build/profile/cert.pem -inkey build/profile/key.pem \
            -out "$APP_PATH/embedded.mobileprovision"
          rm -f build/profile/key.pem build/profile/cert.pem

          echo "### embedded.mobileprovision 大小："
          ls -l "$APP_PATH/embedded.mobileprovision"
          echo "### 里面的 entitlements："
          openssl smime -verify -in "$APP_PATH/embedded.mobileprovision" -inform DER -noverify 2>/dev/null || true

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/FitState.app"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          # 注意：不要删 embedded.mobileprovision，签名工具靠它判断需要哪些能力
          cd build/ipa
          zip -qry FitState.ipa Payload
          ls -lh FitState.ipa
          # ipa 必须至少几十 KB，空壳说明构建没成功
          SIZE=$(stat -f%z FitState.ipa)
          if [ "$SIZE" -lt 50000 ]; then
            echo "::error::ipa 只有 $SIZE 字节，明显是空壳"
            exit 1
          fi

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: FitState-ipa
          path: build/ipa/FitState.ipa
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### 构建完成"
            echo ""
            echo "下载 FitState-ipa 制品里的 FitState.ipa，用 Sideloadly 装到 iPhone。"
            echo ""
            echo "如果之后要升级 App Group，请在仓库 Settings -> Secrets and variables -> Actions 里设置 APP_GROUP_ID 变量。"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
