name: Build iOS App

# 两种签名模式：
#   adhoc —— 免费个人团队路线。产出的包能装能启动，但签名里没有 HealthKit/App Groups 能力，
#            打开会报 "Missing com.apple.developer.healthkit entitlement."。只用来验证 UI 跑得起来。
#   apple —— Apple Developer Program 正规路线。用 App Store Connect API Key 让 xcodebuild 自己
#            申请真描述文件（profile），产出的包由 Apple 签名，HealthKit / App Groups 都在里面。
on:
  workflow_dispatch:
    inputs:
      sign_mode:
        description: '签名模式：adhoc（免费档，仅验证 UI）/ portal（免费档 + 门户直开能力，正签）/ apple（ADP 正规签名）'
        required: false
        default: 'adhoc'
      app_group_id:
        description: 'App Group ID（门户里注册的组，形如 group.com.god.fitstate）'
        required: false
        default: 'group.com.god.fitstate'
      app_group_runtime_id:
        description: '运行时使用的 App Group ID（apple 模式与 app_group_id 相同；adhoc 模式是签名工具改写后的值）'
        required: false
        default: 'group.com.god.fitstate'
      team_id:
        description: '你的 Team ID（10 位大写字母数字，付费后与免费个人团队同一个）'
        required: false
        default: '97792VH57A'
      final_bundle_id:
        description: '最终装到手机上的 bundle id（apple 模式是 com.god.fitstate；adhoc 模式是 <原 id>.<TeamID>）'
        required: false
        default: 'com.god.fitstate.97792VH57A'
      device_udid:
        description: '要装进去的设备 UDID（apple 模式必须先在门户 Devices 里注册这台设备）'
        required: false
        default: '00008140-00166C2636D2801C'
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    name: Build .ipa
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SIGN_MODE: ${{ inputs.sign_mode || 'adhoc' }}
      APP_GROUP_ID: ${{ inputs.app_group_id || vars.APP_GROUP_ID || 'group.com.god.fitstate' }}
      APP_GROUP_RUNTIME_ID: ${{ inputs.app_group_runtime_id || vars.APP_GROUP_RUNTIME_ID || 'group.com.god.fitstate' }}
      TEAM_ID: ${{ inputs.team_id || vars.TEAM_ID || '97792VH57A' }}
      FINAL_BUNDLE_ID: ${{ inputs.final_bundle_id || vars.FINAL_BUNDLE_ID || 'com.god.fitstate.97792VH57A' }}
      DEVICE_UDID: ${{ inputs.device_udid || vars.DEVICE_UDID || '00008140-00166C2636D2801C' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE="$(ls /Applications | grep -E '^Xcode.*\.app$' | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Show build plan
        run: |
          set -euo pipefail
          echo "### 签名模式 = $SIGN_MODE"
          echo "### App Group = $APP_GROUP_ID"
          echo "### 运行时 App Group = $APP_GROUP_RUNTIME_ID"
          echo "### Team ID = $TEAM_ID"
          echo "### 目标 bundle id = $FINAL_BUNDLE_ID"
          echo "### 设备 UDID = $DEVICE_UDID"

      # ---------------------------------------------------------------------
      # portal 模式：免费个人团队路线
      #
      # 直接调 Apple 开发者门户接口（spaceship），给 App ID 开启 HealthKit /
      # App Groups 能力，再申请带这些能力的开发证书与描述文件，自己给 App 正签。
      # 全程不需要 Apple Developer Program。
      # ---------------------------------------------------------------------
      - name: Set up Ruby
        if: env.SIGN_MODE == 'portal'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install spaceship
        if: env.SIGN_MODE == 'portal'
        run: |
          set -euo pipefail
          gem install fastlane --no-document
          ruby -e "require 'spaceship'; puts 'SPACESHIP_OK ' + (defined?(Spaceship::VERSION) ? Spaceship::VERSION.to_s : 'loaded')"

      - name: Apple portal operations
        if: env.SIGN_MODE == 'portal'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_SESSION: ${{ secrets.APPLE_SESSION }}
          TEAM_ID: ${{ inputs.team_id || vars.TEAM_ID || '97792VH57A' }}
          DEVICE_UDID: ${{ inputs.device_udid || vars.DEVICE_UDID || '00008140-00166C2636D2801C' }}
          APP_GROUP_ID: ${{ inputs.app_group_id || vars.APP_GROUP_ID || 'group.com.god.fitstate' }}
          TARGET_APP_BUNDLE_ID: 'com.god.fitstate'
          TARGET_WIDGET_BUNDLE_ID: 'com.god.fitstate.widget'
          OUT_DIR: 'build/portal'
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "::error::缺少仓库 secrets：APPLE_ID / APP_SPECIFIC_PASSWORD"
            echo "::error::去 Settings -> Secrets and variables -> Actions 里补上这两个 secret"
            echo "::error::APP_SPECIFIC_PASSWORD 在 https://appleid.apple.com/account/manage 生成"
            exit 1
          fi
          mkdir -p build/portal
          ruby Scripts/apple-portal.rb 2>&1 | tee build/portal/portal.log
          echo "### 门户操作日志结束"
          cat build/portal/manifest.json

      # ---------------------------------------------------------------------
      # apple 模式：准备 App Store Connect API Key
      # ---------------------------------------------------------------------
      - name: Prepare App Store Connect API key
        if: env.SIGN_MODE == 'apple'
        env:
          ADP_KEY_P8_B64: ${{ secrets.ADP_KEY_P8_B64 }}
          ADP_KEY_ID: ${{ secrets.ADP_KEY_ID }}
          ADP_ISSUER_ID: ${{ secrets.ADP_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ADP_KEY_P8_B64" ] || [ -z "$ADP_KEY_ID" ] || [ -z "$ADP_ISSUER_ID" ]; then
            echo "::error::缺少仓库 secrets：ADP_KEY_P8_B64 / ADP_KEY_ID / ADP_ISSUER_ID"
            echo "::error::请在 Settings -> Secrets and variables -> Actions 里补上这三个 secret"
            exit 1
          fi
          mkdir -p build/key
          printf '%s' "$ADP_KEY_P8_B64" | base64 --decode > "build/key/AuthKey_${ADP_KEY_ID}.p8"
          chmod 600 "build/key/AuthKey_${ADP_KEY_ID}.p8"
          echo "### API Key 就位：AuthKey_${ADP_KEY_ID}.p8"

      # ---------------------------------------------------------------------
      # apple 模式：正规签名构建
      # ---------------------------------------------------------------------
      - name: Build (Apple signed)
        if: env.SIGN_MODE == 'apple'
        env:
          ADP_KEY_ID: ${{ secrets.ADP_KEY_ID }}
          ADP_ISSUER_ID: ${{ secrets.ADP_ISSUER_ID }}
        run: |
          set -euo pipefail
          # -allowProvisioningUpdates 让 xcodebuild 用 API Key 去门户自动建 App ID、
          # 建证书、建描述文件；产出的 .app 里会自带 Apple 签的 embedded.mobileprovision，
          # 描述文件里带 com.apple.developer.healthkit 与 App Groups。
          set +e
          xcodebuild \
            -project FitState.xcodeproj \
            -scheme FitState \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "build/key/AuthKey_${ADP_KEY_ID}.p8" \
            -authenticationKeyID "$ADP_KEY_ID" \
            -authenticationKeyIssuerID "$ADP_ISSUER_ID" \
            APP_GROUP_ID="$APP_GROUP_ID" \
            APP_GROUP_RUNTIME_ID="$APP_GROUP_RUNTIME_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" \
            build > build-apple.log 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "### 构建失败，日志尾部："
            tail -80 build-apple.log || true
            echo "::error::xcodebuild 失败"
            exit 1
          fi
          tail -5 build-apple.log || true

      # ---------------------------------------------------------------------
      # adhoc 模式：未签名构建
      # ---------------------------------------------------------------------
      - name: Build (unsigned, for ad-hoc signing)
        if: env.SIGN_MODE != 'apple'
        run: |
          set -euo pipefail
          # 未签名构建。Xcode 26+ 禁止用 ad-hoc 身份签 iOS 设备包
          # （Ad Hoc code signing is not allowed with SDK 'iOS 26.2'），
          # 所以这里先出无签名产物，再在下一步用 codesign 手动盖 ad-hoc 签名。
          set +e
          xcodebuild \
            -project FitState.xcodeproj \
            -scheme FitState \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            APP_GROUP_ID="$APP_GROUP_ID" \
            APP_GROUP_RUNTIME_ID="$APP_GROUP_RUNTIME_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build > build-unsigned.log 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "### 构建失败，日志尾部："
            tail -60 build-unsigned.log || true
            echo "::error::xcodebuild 失败"
            exit 1
          fi
          tail -5 build-unsigned.log || true

      - name: Verify product layout
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/FitState.app"

          # 关键校验：必须有真实二进制，否则打出来的是空壳 ipa
          if [ ! -f "$APP_PATH/FitState" ]; then
            echo "::error::主程序二进制 FitState 缺失"
            exit 1
          fi
          if [ ! -d "$APP_PATH/PlugIns/FitStateWidget.appex" ]; then
            echo "::error::小组件扩展 PlugIns/FitStateWidget.appex 缺失"
            exit 1
          fi
          if [ ! -f "$APP_PATH/PlugIns/FitStateWidget.appex/FitStateWidget" ]; then
            echo "::error::小组件二进制 FitStateWidget 缺失"
            exit 1
          fi
          echo "### 产物大小："
          du -sh "$APP_PATH"

          # 校验 Info.plist 里的运行时 App Group ID 真的被展开了
          RUNTIME_ID=$(/usr/libexec/PlistBuddy -c "Print :AppGroupIdentifier" "$APP_PATH/Info.plist")
          echo "### 运行时 App Group ID = $RUNTIME_ID"
          if [ -z "$RUNTIME_ID" ] || [[ "$RUNTIME_ID" == *'$('* ]]; then
            echo "::error::Info.plist 的 AppGroupIdentifier 没有被正确展开：$RUNTIME_ID"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # apple 模式：能力校验 + 签内层扩展
      # ---------------------------------------------------------------------
      - name: Verify entitlements and sign embedded extension
        if: env.SIGN_MODE == 'apple'
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/FitState.app"

          if [ ! -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "::error::缺少 embedded.mobileprovision，xcodebuild 没有完成正规签名"
            exit 1
          fi

          security cms -D -i "$APP_PATH/embedded.mobileprovision" > build/profile-real.plist
          echo "### 描述文件里的 Entitlements："
          /usr/libexec/PlistBuddy -c "Print :Entitlements" build/profile-real.plist || true
          echo "### 描述文件有效期 / 设备："
          /usr/libexec/PlistBuddy -c "Print :ExpirationDate" build/profile-real.plist || true
          /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" build/profile-real.plist || true

          # 硬闸门：HealthKit 与 App Groups 必须真的在描述文件里，否则装到手机上
          # 一定会报 "Missing com.apple.developer.healthkit entitlement."
          if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.healthkit" build/profile-real.plist >/dev/null 2>&1; then
            echo "::error::描述文件里没有 com.apple.developer.healthkit —— 门户上的 App ID 没勾 HealthKit 能力"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" build/profile-real.plist >/dev/null 2>&1; then
            echo "::error::描述文件里没有 com.apple.security.application-groups —— 门户上没给这个 App ID 配 App Group"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" build/profile-real.plist 2>/dev/null | grep -q "$DEVICE_UDID"; then
            echo "::error::描述文件里没有目标设备 $DEVICE_UDID —— 门户 Devices 里还没注册这台 iPhone"
            exit 1
          fi

          echo "### App 的签名 entitlements："
          codesign -d --entitlements :- "$APP_PATH" || true

      - name: Verify and ad-hoc sign
        if: env.SIGN_MODE == 'adhoc'
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/FitState.app"

          # 把 $(APP_GROUP_ID) 展开成实际值，写进临时 entitlements
          mkdir -p build/ent
          sed 's|$(APP_GROUP_ID)|'"$APP_GROUP_ID"'|g' Sources/App/FitState.entitlements > build/ent/app.plist
          sed 's|$(APP_GROUP_ID)|'"$APP_GROUP_ID"'|g' Sources/Widget/FitStateWidget.entitlements > build/ent/widget.plist

          # 先签内层扩展，再签外层 App
          codesign --force --sign - --entitlements build/ent/widget.plist \
            "$APP_PATH/PlugIns/FitStateWidget.appex"
          codesign --force --sign - --entitlements build/ent/app.plist \
            "$APP_PATH"

          echo "### 嵌入的 entitlements："
          codesign -d --entitlements :- "$APP_PATH" || true

      # ---------------------------------------------------------------------
      # adhoc 模式：自造一份描述文件给签名工具看
      # ---------------------------------------------------------------------
      - name: Embed provisioning profile hint
        if: env.SIGN_MODE == 'adhoc'
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/FitState.app"
          mkdir -p build/profile

          # Sideloadly 这类签名工具是靠 ipa 里的 embedded.mobileprovision 来判断
          # 这个 app 需要哪些 capability（HealthKit / App Groups…），再去门户申请。
          # 没有这个文件，它只会建一个裸 App ID，签出来的包就没有 HealthKit 权限，
          # 装到手机上会直接报 "Missing com.apple.developer.healthkit entitlement"。
          #
          # 这里自己造一份描述文件，要点：
          #   1. 外层用 CMS 封装（签名工具用 PKCS#7 解析）
          #   2. application-identifier 必须等于签名工具最终用的 bundle id
          #   3. ProvisionedDevices 要包含目标设备 UDID
          #   4. DeveloperCertificates 不能为空
          #   5. CreationDate / ExpirationDate 要成对
          openssl req -x509 -newkey rsa:2048 -keyout build/profile/key.pem -out build/profile/cert.pem \
            -days 3650 -nodes -subj "/CN=FitState Profile" >/dev/null 2>&1
          CERT_DER_B64=$(openssl x509 -in build/profile/cert.pem -outform DER | base64 | tr -d '\n')
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EXP=$(date -u -v+7d +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)
          UUID_VAL=$(uuidgen | tr '[:upper:]' '[:lower:]')

          cat > build/profile/profile.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>AppIDName</key><string>FitState</string>
            <key>ApplicationIdentifierPrefix</key>
            <array><string>${TEAM_ID}</string></array>
            <key>CreationDate</key><date>${NOW}</date>
            <key>Platform</key>
            <array><string>iOS</string></array>
            <key>DeveloperCertificates</key>
            <array>
              <data>${CERT_DER_B64}</data>
            </array>
            <key>Entitlements</key>
            <dict>
              <key>application-identifier</key><string>${TEAM_ID}.${FINAL_BUNDLE_ID}</string>
              <key>com.apple.developer.team-identifier</key>
              <array><string>${TEAM_ID}</string></array>
              <key>get-task-allow</key><true/>
              <key>keychain-access-groups</key>
              <array><string>${TEAM_ID}.${FINAL_BUNDLE_ID}</string></array>
              <key>com.apple.developer.healthkit</key><true/>
              <key>com.apple.developer.healthkit.access</key><array/>
              <key>com.apple.security.application-groups</key>
              <array><string>${APP_GROUP_RUNTIME_ID}</string></array>
            </dict>
            <key>ExpirationDate</key><date>${EXP}</date>
            <key>IsXcodeManaged</key><false/>
            <key>Name</key><string>FitState</string>
            <key>ProvisionedDevices</key>
            <array><string>${DEVICE_UDID}</string></array>
            <key>ProvisionsAllDevices</key><false/>
            <key>TeamIdentifier</key>
            <array><string>${TEAM_ID}</string></array>
            <key>TeamName</key><string>FitState</string>
            <key>TimeToLive</key><integer>7</integer>
            <key>UUID</key><string>${UUID_VAL}</string>
            <key>Version</key><integer>1</integer>
          </dict>
          </plist>
          PLIST

          # 自签一份 CMS 外壳，让签名工具能按 mobileprovision 的方式解析
          openssl smime -sign -in build/profile/profile.plist -outform DER -nodetach -binary \
            -signer build/profile/cert.pem -inkey build/profile/key.pem \
            -out "$APP_PATH/embedded.mobileprovision"
          rm -f build/profile/key.pem build/profile/cert.pem

          echo "### embedded.mobileprovision 大小："
          ls -l "$APP_PATH/embedded.mobileprovision"

      # ---------------------------------------------------------------------
      # portal 模式：用我们自己申请的证书 + 描述文件正签
      # ---------------------------------------------------------------------
      - name: Sign with our own certificate and profile
        if: env.SIGN_MODE == 'portal'
        run: |
          set -euo pipefail
          bash Scripts/sign-ipa.sh 2>&1 | tee build/sign.log
          if ! grep -q "SIGN_OK" build/sign.log; then
            echo "::error::签名流程没有成功"
            exit 1
          fi

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/FitState.app"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry FitState.ipa Payload
          ls -lh FitState.ipa
          # ipa 必须至少几十 KB，空壳说明构建没成功
          SIZE=$(stat -f%z FitState.ipa)
          if [ "$SIZE" -lt 50000 ]; then
            echo "::error::ipa 只有 $SIZE 字节，明显是空壳"
            exit 1
          fi

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: FitState-ipa
          path: build/ipa/FitState.ipa
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### 构建完成（签名模式：${SIGN_MODE}）"
            echo ""
            if [ "$SIGN_MODE" = "apple" ]; then
              echo "下载 FitState-ipa 制品里的 FitState.ipa。"
              echo "这是 Apple 正签的包，**不要**再用 Sideloadly 装（它会重签并抹掉能力），"
              echo "请用 Apple Configurator 2 / Apple Devices / iMazing 安装。"
            elif [ "$SIGN_MODE" = "portal" ]; then
              echo "下载 FitState-ipa 制品里的 FitState.ipa。"
              echo "这是用免费个人团队在门户直开 HealthKit / App Groups 后自己签的包，"
              echo "**不要**再用 Sideloadly 装（它会重签并抹掉能力），"
              echo "请用 Apple Configurator 2 / Apple Devices / iMazing 安装。"
            else
              echo "下载 FitState-ipa 制品里的 FitState.ipa，用 Sideloadly 装到 iPhone。"
              echo "注意：该模式没有 HealthKit 能力，App 会报 entitlement 缺失。"
            fi
            echo ""
            echo "如果之后要改 App Group，请在仓库 Settings -> Secrets and variables -> Actions 里改 APP_GROUP_ID 变量。"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
